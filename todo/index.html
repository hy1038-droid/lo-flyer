<meta name="theme-color" content="#c8102e">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f3f1ec,#141312);--paper:light-dark(#fff,#1e1d1b);--ink:light-dark(#1a1917,#ecebe7);
--mute:light-dark(#76736c,#9c9890);--line:light-dark(#e6e2d9,#33312d);--red:#c8102e;
--redsoft:light-dark(#fbe9ec,#3a1a1f);--done:light-dark(#b3afa6,#5f5b55)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 -apple-system,"PingFang SC","Noto Sans SC",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 170px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.date{font-weight:700;font-size:32px;line-height:1.1;margin:0}
.wk{color:var(--mute);font-size:15px}
.nav{display:flex;gap:6px}
button{font:inherit;color:inherit;cursor:pointer}
.nb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:20px}
.nb.today{width:auto;padding:0 12px;font-size:15px}
.sheet{background:var(--paper);border-radius:18px;box-shadow:0 10px 26px -18px rgba(0,0,0,.4);overflow:hidden}
.prog{display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:14px;color:var(--mute)}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:flex-start;gap:4px;padding:2px 6px;border-top:1px solid var(--line)}
.circ{flex:none;width:46px;height:46px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.circ span{width:27px;height:27px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center}
.circ svg{width:15px;height:15px;opacity:0}
li.dn .circ span{background:var(--red);border-color:var(--red)}li.dn .circ svg{opacity:1}
.tx{flex:1;padding:11px 4px;line-height:1.45;outline:none;word-break:break-word;border-radius:6px;-webkit-user-select:text;user-select:text}
.tx:focus{background:var(--redsoft)}
li.dn .tx{text-decoration:line-through;text-decoration-thickness:2px;color:var(--done)}
.del{flex:none;width:44px;height:46px;border:0;background:transparent;color:var(--mute);font-size:22px;opacity:.5}
.add{display:flex;align-items:center;border-top:1px solid var(--line);padding:4px 6px}
.add .plus{width:46px;text-align:center;font-size:24px;color:var(--mute)}
.add input{flex:1;height:46px;border:0;background:transparent;color:var(--ink);font:16px inherit;font-family:inherit;outline:none}
.empty{padding:26px 18px;color:var(--mute);text-align:center;font-size:15px;border-top:1px solid var(--line)}
.carry{margin:12px 0 0;padding:10px 12px;border:1px dashed var(--red);border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;background:var(--paper)}
.b{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 16px);background:linear-gradient(transparent,var(--bg) 30%);display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.live{pointer-events:auto;max-width:600px;width:100%;min-height:0;background:var(--paper);border-radius:14px;padding:10px 14px;font-size:16px;box-shadow:0 6px 20px -10px rgba(0,0,0,.35)}
.mic{pointer-events:auto;width:78px;height:78px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -6px rgba(200,16,46,.6)}
.mic svg{width:34px;height:34px}
.mic.on{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(200,16,46,.2)}}
.hint{font-size:13px;color:var(--mute);pointer-events:auto}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:12px;padding:6px 6px 6px 14px;display:flex;gap:8px;align-items:center;font-size:15px;z-index:9}
.toast button{background:transparent;border:0;color:#ff5a6e;font-weight:700;min-height:38px;padding:0 10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 class="date" id="dt"></h1><div class="wk" id="wk"></div></div>
    <div class="nav"><button class="nb" id="prev" aria-label="前一天">‹</button><button class="nb today" id="tod">今天</button><button class="nb" id="next" aria-label="后一天">›</button></div>
  </div>
  <div class="sheet">
    <div class="prog"><span id="pc"></span><div class="bar"><i id="pb"></i></div></div>
    <ul id="list"></ul>
    <div class="empty" id="empty">还没有待办。按下面的红色按钮说一句。</div>
    <form class="add" id="addf"><span class="plus">+</span><input id="addi" placeholder="打字添加，回车保存" autocomplete="off" enterkeyhint="done"></form>
  </div>
  <div class="carry" id="carry" hidden><span id="carrytx"></span><button class="b" id="carrybtn">挪到今天</button></div>
</div>
<div class="dock">
  <div class="live" id="live" hidden></div>
  <button class="mic" id="mic" aria-label="按下说话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
  <div class="hint" id="hint">点一下说话，说完自动加入</div>
</div>
<div class="toast" id="toast" hidden><span id="toasttx"></span><button id="undo">撤销</button></div>
<script>
{
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const WK=['周日','周一','周二','周三','周四','周五','周六'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const SK='lo-todo-v1';
let tasks=[];try{tasks=JSON.parse(localStorage.getItem(SK)||'[]');}catch(e){}
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(tasks));}catch(e){}};
let cur=new Date();cur.setHours(0,0,0,0);

function render(){
  const k=key(cur),today=key(new Date());
  $('dt').textContent=(cur.getMonth()+1)+'月'+cur.getDate()+'日';
  const diff=Math.round((cur-new Date(today+'T00:00'))/864e5);
  $('wk').textContent=WK[cur.getDay()]+(diff===0?' · 今天':diff===-1?' · 昨天':diff===1?' · 明天':'');
  $('tod').hidden=diff===0;
  const day=tasks.filter(t=>t.date===k).sort((a,b)=>(a.done-b.done)||(a.order-b.order));
  const n=day.length,d=day.filter(t=>t.done).length;
  $('pc').textContent=d+' / '+n+' 完成';$('pb').style.width=n?(d/n*100)+'%':'0';
  $('empty').hidden=n>0;
  $('list').innerHTML=day.map(t=>`<li data-id="${esc(t.id)}" class="${t.done?'dn':''}"><button class="circ" aria-label="完成"><span>${CHECK}</span></button><div class="tx" contenteditable="true">${esc(t.text)}</div><button class="del" aria-label="删除">×</button></li>`).join('');
  const old=tasks.filter(t=>!t.done&&t.date<today);
  $('carry').hidden=!(diff===0&&old.length);
  $('carrytx').textContent='之前还有 '+old.length+' 项没完成';
}
function addTask(text){
  text=text.trim().replace(/^[，。、,.\s]+|[，。、,.\s]+$/g,'');if(!text)return;
  tasks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text,date:key(cur),done:false,order:Date.now()+Math.random()});
}
// split one spoken sentence into several items
function splitSpeech(s){
  s=s.replace(/^(嗯+|呃+|那个|就是)[，,\s]*/,'');
  const parts=s.split(/[。；;！!？?\n]|，?(?:然后|还有|另外|接着|再就是|之后|第[一二三四五六七八九十]+(?:件事|个|条)?|[一二三四五六七八九十]是)[，,]?/);
  return parts.map(p=>p.replace(/^[，,、\s]*(?:嗯+|呃+|就是|那个|要|我要|我得|今天要|今天)?[，,\s]*/,'').trim()).filter(p=>p.length>1);
}

$('list').addEventListener('click',e=>{
  const li=e.target.closest('li');if(!li)return;const t=tasks.find(x=>x.id===li.dataset.id);if(!t)return;
  if(e.target.closest('.circ')){t.done=!t.done;save();render();}
  else if(e.target.closest('.del')){tasks=tasks.filter(x=>x!==t);save();render();lastDel=t;toast('已删除');}
});
$('list').addEventListener('keydown',e=>{if(e.target.classList.contains('tx')&&e.key==='Enter'){e.preventDefault();e.target.blur();}});
$('list').addEventListener('focusout',e=>{
  if(!e.target.classList.contains('tx'))return;const t=tasks.find(x=>x.id===e.target.closest('li').dataset.id);if(!t)return;
  const v=e.target.textContent.trim();if(!v){e.target.textContent=t.text;return;}if(v!==t.text){t.text=v;save();}
});
$('addf').addEventListener('submit',e=>{e.preventDefault();addTask($('addi').value);$('addi').value='';save();render();});
const go=n=>{cur=new Date(cur.getFullYear(),cur.getMonth(),cur.getDate()+n);render();};
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('tod').onclick=()=>{cur=new Date();cur.setHours(0,0,0,0);render();};
$('carrybtn').onclick=()=>{const today=key(new Date());tasks.forEach(t=>{if(!t.done&&t.date<today)t.date=today;});save();render();};

let lastDel=null,tt=null;
function toast(msg){$('toasttx').textContent=msg;$('undo').hidden=!lastDel;$('toast').hidden=false;clearTimeout(tt);tt=setTimeout(()=>{$('toast').hidden=true;lastDel=null;},5000);}
$('undo').onclick=()=>{if(lastDel){tasks.push(lastDel);save();lastDel=null;$('toast').hidden=true;render();}};

// ---------- voice ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,on=false,heard='';
function setOn(v){on=v;$('mic').classList.toggle('on',v);$('hint').textContent=v?'在听…说完停一下，或再点一下结束':'点一下说话，说完自动加入';if(!v)$('live').hidden=!heard&&true;}
if(!SR){$('hint').textContent='这个浏览器不支持语音，请用 Safari 打开';}
$('mic').onclick=()=>{
  if(!SR){toast('请用 iPhone 的 Safari 打开这个页面');return;}
  if(on){rec&&rec.stop();return;}
  heard='';$('live').hidden=false;$('live').textContent='请说…';
  rec=new SR();rec.lang='zh-CN';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  rec.onresult=e=>{let s='';for(const r of e.results)s+=r[0].transcript;heard=s;$('live').textContent=s;};
  rec.onerror=e=>{const m={'not-allowed':'没有话筒权限：设置 → Safari → 麦克风，选“允许”','service-not-allowed':'请在 设置 → Siri 里打开“听写”','no-speech':'没听到声音，再试一次','network':'语音识别需要联网'}[e.error];if(m)toast(m);};
  rec.onend=()=>{
    setOn(false);
    if(heard.trim()){const items=splitSpeech(heard);(items.length?items:[heard]).forEach(addTask);save();render();lastDel=null;toast('已加入 '+(items.length||1)+' 项');}
    heard='';setTimeout(()=>{if(!on)$('live').hidden=true;},400);
  };
  try{rec.start();setOn(true);}catch(e){toast('话筒打不开，再点一次试试');}
};
render();
}
</script>
</body>
</html>
